# Motherly: baza, backend va veb-panel — uchalasi alohida konteynerda.
# Ishga tushirish: ./deploy.sh
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: motherly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d motherly"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 5100
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@db:5432/motherly
      JWT_SECRET: ${JWT_SECRET}
      DEV_SMS_CODE: ${DEV_SMS_CODE:-1111}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - uploads:/app/uploads
      - private:/app/private
    ports:
      - "${BACKEND_PORT:-5100}:5100"

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5100}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-3000}:3000"

volumes:
  pgdata:
  uploads:
  private:
